<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowCode - Login</title>
</head>

<body>

    <header>
        <h1>GrowCode</h1>

        <nav>
            <a>Problems</a>
            <a>Register</a>
        </nav>
    </header>

    <main>

        <h2>Login</h2>

        <form>

            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <br><br>

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <br><br>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account? Register
        </p>

    </main>

</body>
</html>
